<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Ops Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4EF; --panel:#FFFFFF; --ink:#14161B; --ink-soft:#5A5E66; --line:#E7E4DA;
  --rust:#FF5630; --teal:#00B39F; --violet:#8B7CF6; --rust-tint:#FFE9E1; --teal-tint:#DFF7F2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101214; --panel:#1B1E22; --ink:#F1EFE9; --ink-soft:#9CA0A6; --line:#2B2F34;
    --rust:#FF7A57; --teal:#31CDB5; --violet:#A79BFF; --rust-tint:#2B1912; --teal-tint:#0F2620;
  }
}
:root[data-theme="dark"]{
  --bg:#101214; --panel:#1B1E22; --ink:#F1EFE9; --ink-soft:#9CA0A6; --line:#2B2F34;
  --rust:#FF7A57; --teal:#31CDB5; --violet:#A79BFF; --rust-tint:#2B1912; --teal-tint:#0F2620;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
.font-m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;}
.rail{position:sticky;top:0;height:3px;background:var(--line);z-index:5;}
.rail-fill{height:100%;background:var(--ink);width:0%;transition:width .4s ease;}
.wrap{max-width:640px;margin:0 auto;padding:56px 24px 100px;}
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:64px;gap:16px;}
.brand-mark{font-family:'Onest';font-weight:700;font-size:15px;letter-spacing:-.01em;}
.lang-toggle{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.lang-btn{font-family:"JetBrains Mono";font-size:11.5px;border:none;background:none;color:var(--ink-soft);
  padding:6px 12px;border-radius:16px;cursor:pointer;}
.lang-btn.active{background:var(--ink);color:var(--bg);}
.screen{display:none;}
.screen.active{display:block;animation:rise .5s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
h1{font-family:'Onest';font-weight:800;font-size:35px;line-height:1.2;margin:0 0 20px;letter-spacing:-.02em;}
.lede{font-size:17px;color:var(--ink-soft);max-width:52ch;margin:0 0 36px;}
.btn{font-family:'Onest';font-weight:700;font-size:15px;border:none;border-radius:11px;
  padding:15px 28px;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .15s ease,opacity .15s ease,box-shadow .15s ease;display:inline-block;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.btn:hover{opacity:.9;box-shadow:0 4px 16px rgba(0,0,0,.16);}
.btn:active{transform:scale(.98);}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
.meta-row{display:flex;gap:22px;margin-top:34px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
.meta-row span{display:flex;align-items:center;gap:7px;}
.meta-row b{color:var(--ink);font-weight:700;}
.zones{display:flex;gap:10px;margin-top:48px;border-top:1px solid var(--line);padding-top:22px;flex-wrap:wrap;}
.zone-chip{font-family:"JetBrains Mono";font-size:11.5px;color:var(--ink-soft);padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;}

.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px;}
.qmeta .qn{font-family:"JetBrains Mono";font-size:13px;color:var(--ink-soft);}
.qmeta .qz{font-family:"JetBrains Mono";font-size:12px;color:var(--rust);background:var(--rust-tint);padding:4px 11px;border-radius:20px;}
.qtext{font-family:'Onest';font-size:24px;font-weight:700;line-height:1.35;margin:0 0 30px;max-width:34ch;letter-spacing:-.01em;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 18px;
  font-family:'Onest';font-size:15px;color:var(--ink);cursor:pointer;display:flex;gap:14px;align-items:center;
  transition:border-color .15s ease,box-shadow .15s ease,transform .1s ease;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.opt:hover{border-color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px);}
.opt .k{font-family:"JetBrains Mono";font-size:11px;color:var(--ink-soft);flex-shrink:0;width:24px;height:24px;
  border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.opt:hover .k{border-color:var(--ink);color:var(--ink);}

.headline{font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.res-title{font-family:'Onest';font-size:30px;font-weight:800;line-height:1.25;margin:0 0 16px;max-width:26ch;letter-spacing:-.01em;}
.res-body{color:var(--ink-soft);font-size:16px;max-width:54ch;margin-bottom:8px;}
.meters{margin:40px 0 42px;display:flex;flex-direction:column;gap:18px;}
.meter-row{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:14px;}
.meter-label{font-size:13.5px;color:var(--ink-soft);}
.meter-track{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.meter-fill{height:100%;border-radius:10px;width:0%;transition:width .8s cubic-bezier(.2,.8,.3,1);}
.meter-pct{font-family:"JetBrains Mono";font-size:13px;text-align:right;color:var(--ink);}
.friction-panel{background:var(--rust-tint);border-radius:14px;padding:22px 24px;margin:8px 0 40px;}
.friction-panel.ok{background:var(--teal-tint);}
.friction-label{font-family:"JetBrains Mono";font-size:11.5px;color:var(--rust);margin-bottom:6px;}
.friction-panel.ok .friction-label{color:var(--teal);}
.friction-title{font-family:'Onest';font-weight:700;font-size:18px;margin-bottom:6px;}
.take-list{list-style:none;padding:0;margin:0 0 44px;display:flex;flex-direction:column;gap:0;}
.take-list li{padding:16px 0;border-bottom:1px solid var(--line);font-size:15px;display:flex;gap:14px;}
.take-list li:first-child{border-top:1px solid var(--line);}
.take-list .tk{font-family:"JetBrains Mono";font-size:12px;color:var(--ink-soft);flex-shrink:0;padding-top:2px;}
.cta-panel{background:var(--ink);color:var(--bg);border-radius:18px;padding:32px 28px;}
.cta-panel h3{font-family:'Onest';font-size:20px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;}
.cta-panel p{color:color-mix(in srgb, var(--bg) 70%, transparent);opacity:.75;font-size:14.5px;margin:0 0 22px;max-width:48ch;}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;}
.cta-panel .btn{background:var(--bg);color:var(--ink);}
.cta-panel .btn-outline{background:transparent;color:var(--bg);border:1px solid rgba(255,255,255,.25);}
@media(max-width:480px){
  h1{font-size:28px;} .qtext{font-size:21px;} .res-title{font-size:25px;}
  .meter-row{grid-template-columns:104px 1fr 40px;gap:10px;}
  .wrap{padding:36px 18px 80px;}
}
</style>
</head>
<body>

<div class="rail"><div class="rail-fill" id="railFill"></div></div>

<div class="wrap">
  <div class="brand">
    <div class="brand-mark" id="brandMark">Product Ops Diagnostic</div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btnRu" onclick="setLang('ru')">RU</button>
    </div>
  </div>

  <!-- INTRO -->
  <section class="screen active" id="screen-intro">
    <h1 id="heroTitle"></h1>
    <p class="lede" id="heroLede"></p>
    <button class="btn" id="startBtn" onclick="startQuiz()"></button>
    <div class="meta-row">
      <span><b>7</b> <span id="metaQ"></span></span>
      <span><b>~3</b> <span id="metaMin"></span></span>
      <span><b>4</b> <span id="metaZones"></span></span>
    </div>
    <div class="zones" id="zoneChips"></div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="screen-quiz">
    <div class="qmeta">
      <span class="qn" id="qCount"></span>
      <span class="qz" id="qZone"></span>
    </div>
    <h2 class="qtext" id="qText"></h2>
    <div class="opts" id="qOpts"></div>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="screen-results">
    <div class="headline" id="resHeadline"></div>
    <h2 class="res-title" id="resTitle"></h2>
    <p class="res-body" id="resBody"></p>

    <div class="meters" id="meters"></div>

    <div class="friction-panel" id="frictionPanel">
      <div class="friction-label" id="frictionLabel"></div>
      <div class="friction-title" id="frictionTitle"></div>
      <p class="res-body" id="frictionBody" style="margin-bottom:0;"></p>
    </div>

    <div id="takeSection">
      <div class="headline" id="takeHeadline"></div>
      <ul class="take-list" id="takeList"></ul>
    </div>

    <div class="cta-panel" id="ctaPanel">
      <h3 id="ctaTitle"></h3>
      <p id="ctaBody"></p>
      <div class="cta-row">
        <a class="btn" id="ctaConnect" href="https://www.linkedin.com/in/ritaya/" target="_blank" rel="noopener"></a>
        <button class="btn btn-outline" id="ctaRestart" onclick="restart()"></button>
      </div>
    </div>
  </section>
</div>

<script>

let lang = 'en';
let current = 0;
const answers = [];
let lastZoneResult = null;

function t(){ return I18N[lang]; }

function setLang(l){
  lang = l;
  document.getElementById('btnEn').classList.toggle('active', l==='en');
  document.getElementById('btnRu').classList.toggle('active', l==='ru');
  document.documentElement.lang = l;
  renderIntro();
  if(document.getElementById('screen-quiz').classList.contains('active')) renderQuestion();
  if(document.getElementById('screen-results').classList.contains('active')) renderResults(lastZoneResult);
}

function renderIntro(){
  const d = t();
  document.getElementById('brandMark').textContent = d.brandMark;
  document.getElementById('heroTitle').textContent = d.heroTitle;
  document.getElementById('heroLede').textContent = d.heroLede;
  document.getElementById('startBtn').textContent = d.startBtn;
  document.getElementById('metaQ').textContent = d.metaQ;
  document.getElementById('metaMin').textContent = d.metaMin;
  document.getElementById('metaZones').textContent = d.metaZones;
  const zc = document.getElementById('zoneChips');
  zc.innerHTML = '';
  d.zoneChips.forEach(z=>{
    const el = document.createElement('div');
    el.className = 'zone-chip';
    el.textContent = z;
    zc.appendChild(el);
  });
}

function startQuiz(){
  show('screen-quiz');
  renderQuestion();
}

function renderQuestion(){
  const d = t();
  const q = QUESTIONS[current];
  const qd = d.questions[current];
  document.getElementById('qCount').textContent = d.qOf(current+1, QUESTIONS.length);
  document.getElementById('qZone').textContent = d.zoneNames[q.zone];
  document.getElementById('qText').textContent = qd.text;
  document.getElementById('railFill').style.width = `${(current/QUESTIONS.length)*100}%`;
  const optsEl = document.getElementById('qOpts');
  optsEl.innerHTML = '';
  const keys = ['A','B','C','D'];
  qd.opts.forEach((txt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${keys[i]}</span><span>${txt}</span>`;
    b.onclick = ()=>selectOption(q.opts[i]);
    optsEl.appendChild(b);
  });
}

function selectOption(score){
  answers.push({zone:QUESTIONS[current].zone, score});
  current++;
  if(current < QUESTIONS.length){
    document.getElementById('screen-quiz').classList.remove('active');
    void document.getElementById('screen-quiz').offsetWidth;
    document.getElementById('screen-quiz').classList.add('active');
    renderQuestion();
  } else {
    document.getElementById('railFill').style.width = '100%';
    lastZoneResult = computeResult();
    renderResults(lastZoneResult);
    show('screen-results');
  }
}

function computeResult(){
  const totals = {}, counts = {};
  answers.forEach(a=>{
    totals[a.zone] = (totals[a.zone]||0) + a.score;
    counts[a.zone] = (counts[a.zone]||0) + 1;
  });
  const pct = {};
  ZONE_KEYS.forEach(z=>{ pct[z] = counts[z] ? Math.round((totals[z]/(counts[z]*3))*100) : 0; });
  const overall = Math.round(ZONE_KEYS.reduce((s,z)=>s+pct[z],0)/ZONE_KEYS.length);
  let lowestZone = ZONE_KEYS[0];
  ZONE_KEYS.forEach(z=>{ if(pct[z] < pct[lowestZone]) lowestZone = z; });
  const lowCount = ZONE_KEYS.filter(z=>pct[z] < 40).length;
  let copyKey;
  if(overall >= 75) copyKey = 'ok';
  else if(lowCount >= 3) copyKey = 'all';
  else copyKey = lowestZone;
  return {pct, overall, copyKey};
}

function renderResults(r){
  if(!r) return;
  const d = t();
  document.getElementById('resHeadline').textContent = d.resHeadline;
  const copy = d.results[r.copyKey];
  document.getElementById('resTitle').textContent = copy.title;
  document.getElementById('resBody').textContent = d.resBodyTpl(r.overall);

  const metersEl = document.getElementById('meters');
  metersEl.innerHTML = '';
  ZONE_KEYS.forEach(z=>{
    const p = r.pct[z];
    const row = document.createElement('div');
    row.className = 'meter-row';
    row.innerHTML = `<div class="meter-label">${d.zoneNames[z]}</div>
      <div class="meter-track"><div class="meter-fill" style="background:${ZONE_COLOR[z]}"></div></div>
      <div class="meter-pct font-m">${p}%</div>`;
    metersEl.appendChild(row);
    requestAnimationFrame(()=>{ row.querySelector('.meter-fill').style.width = p+'%'; });
  });

  const panel = document.getElementById('frictionPanel');
  panel.classList.toggle('ok', r.copyKey==='ok');
  document.getElementById('frictionLabel').textContent = copy.label;
  document.getElementById('frictionTitle').textContent = copy.title;
  document.getElementById('frictionBody').textContent = copy.body;

  const takeSection = document.getElementById('takeSection');
  document.getElementById('takeHeadline').textContent = d.takeHeadline;
  const list = document.getElementById('takeList');
  list.innerHTML = '';
  const ctaPanel = document.getElementById('ctaPanel');
  if(r.copyKey === 'ok'){
    takeSection.style.display = 'none';
    ctaPanel.style.display = 'none';
  } else {
    takeSection.style.display = 'block';
    ctaPanel.style.display = 'block';
    const items = d.take[r.copyKey] || d.take.default;
    items.forEach((it,i)=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="tk">0${i+1}</span><span>${it}</span>`;
      list.appendChild(li);
    });
  }

  document.getElementById('ctaTitle').textContent = d.ctaTitle;
  document.getElementById('ctaBody').textContent = d.ctaBody;
  document.getElementById('ctaConnect').textContent = d.ctaConnect;
  document.getElementById('ctaRestart').textContent = d.ctaRestart;
}

function restart(){
  current = 0;
  answers.length = 0;
  lastZoneResult = null;
  document.getElementById('railFill').style.width = '0%';
  show('screen-intro');
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}
